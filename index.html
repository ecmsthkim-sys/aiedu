<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파이썬 업무 자동화 실습 가이드 v2</title>
<style>
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--surface3:#2d333b;
  --border:#30363d;--accent:#4493f8;--accent2:#7c5cbf;--green:#3fb950;
  --yellow:#d29922;--orange:#f0883e;--red:#f85149;--purple:#bc8cff;
  --text:#e6edf3;--text-dim:#8b949e;--text-faint:#484f58;
  --hl-line:rgba(68,147,248,0.1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;font-size:14px;line-height:1.6;overflow:hidden;height:100vh;height:calc(var(--vh100,1vh) * 100);display:flex;flex-direction:column}

/* ── TOP NAV ── */
.topnav{height:48px;min-height:48px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;position:relative;z-index:200}
.logo{font-weight:900;font-size:clamp(12px,3vw,15px);color:var(--accent);white-space:nowrap}
.nav-tabs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{padding:clamp(4px,1vw,6px) clamp(7px,2vw,12px);border-radius:6px;font-size:clamp(10px,2.2vw,12px);font-weight:500;color:var(--text-dim);cursor:pointer;white-space:nowrap;transition:all .2s;border:1px solid transparent}
.nav-tab:hover{color:var(--text);background:var(--surface2)}
.nav-tab.active{color:var(--accent);background:rgba(68,147,248,.12);border-color:rgba(68,147,248,.3)}
.nav-tab.done{color:var(--green)}
.prog-wrap{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
.prog-bar{width:100px;height:5px;background:var(--border);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
.prog-txt{font-size:11px;color:var(--text-dim);min-width:28px}

/* ── LAYOUT ── */
.layout{display:grid;grid-template-columns:1fr clamp(280px, 32vw, 420px);flex:1;min-height:0;height:calc(100vh - 48px);height:calc(calc(var(--vh100,1vh) * 100) - 48px);transition:grid-template-columns .2s ease}

/* ── CODE PANEL ── */
.code-panel{display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden}
.code-header{padding:8px 16px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0}
.win-dots{display:flex;gap:5px}
.dot{width:11px;height:11px;border-radius:50%}
.dot-r{background:#ff5f57}.dot-y{background:#ffbd2e}.dot-g{background:#28ca41}
.code-fname{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;font-size:12px;color:var(--text-dim);margin-left:4px}
.code-scroll{flex:1;overflow-y:auto;padding:8px 0}
.code-line{display:flex;align-items:flex-start;cursor:pointer;border-left:3px solid transparent;transition:background .15s;position:relative}
.code-line:hover{background:rgba(255,255,255,.03)}
.code-line.active{background:var(--hl-line);border-left-color:var(--accent)}
.code-line.has-guide:hover{background:rgba(68,147,248,.06)}
.lnum{width:44px;min-width:44px;text-align:right;padding:1px 10px 1px 0;color:var(--text-faint);font-family:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;font-size:12px;user-select:none;line-height:1.8}
.lcode{flex:1;padding:1px 16px 1px 6px;font-family:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;font-size:12.5px;white-space:pre;line-height:1.8;tab-size:4}
.lmark{width:18px;min-width:18px;display:flex;align-items:center;justify-content:center;font-size:9px;color:rgba(68,147,248,.4)}
.code-line.active .lmark{color:var(--accent)}
.kw{color:#ff7b72}.fn{color:#d2a8ff}.st{color:#a5d6ff}.cm{color:#8b949e;font-style:italic}.nm{color:#79c0ff}

/* 용어 툴팁 */
.term{border-bottom:1px dashed rgba(68,147,248,.5);cursor:help;color:var(--accent);position:relative}
.term-tip{display:none;position:absolute;bottom:calc(100% + 6px);left:0;background:#1c2333;border:1px solid var(--accent);border-radius:8px;padding:10px 14px;width:240px;font-size:12px;color:var(--text);line-height:1.6;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.5);font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;white-space:normal}
.term:hover .term-tip{display:block}
.term-tip .tip-title{font-weight:700;color:var(--accent);margin-bottom:4px;font-size:12px}
.term-tip .tip-analogy{color:var(--yellow);font-size:11px;margin-top:4px;padding-top:4px;border-top:1px solid var(--border)}

/* ── GUIDE PANEL ── */
.guide-panel{display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}
.guide-scroll{flex:1;overflow-y:auto;padding:20px}
.guide-nav{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
.btn{padding:7px 12px;border-radius:7px;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;display:flex;align-items:center;gap:4px;transition:all .2s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff;flex:1;justify-content:center}
.btn-primary:hover{background:#6aa8f8}
.btn-secondary{background:var(--surface2);color:var(--text-dim);border:1px solid var(--border)}
.btn-secondary:hover{color:var(--text);border-color:var(--accent)}
.btn-copy{background:rgba(63,185,80,.12);color:var(--green);border:1px solid rgba(63,185,80,.3)}
.btn-copy:hover{background:rgba(63,185,80,.22)}
.btn-err{background:rgba(248,81,73,.1);color:var(--red);border:1px solid rgba(248,81,73,.25)}
.btn-err:hover{background:rgba(248,81,73,.2)}
.btn-env{background:rgba(210,153,34,.1);color:var(--yellow);border:1px solid rgba(210,153,34,.25)}
.btn-env:hover{background:rgba(210,153,34,.2)}
.btn-warn{background:rgba(240,136,62,.1);color:var(--orange);border:1px solid rgba(240,136,62,.25)}
.btn-warn:hover{background:rgba(240,136,62,.2)}
.btn-gpt{background:rgba(16,163,127,.1);color:#10a37f;border:1px solid rgba(16,163,127,.25)}
.btn-gpt:hover{background:rgba(16,163,127,.2)}

/* ── GUIDE COMPONENTS ── */
.stage-pill{display:inline-flex;align-items:center;gap:5px;background:rgba(68,147,248,.12);border:1px solid rgba(68,147,248,.25);color:var(--accent);font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;margin-bottom:10px;letter-spacing:.3px}
.g-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px;line-height:1.4}
.g-desc{color:var(--text-dim);font-size:13px;line-height:1.7;margin-bottom:14px}
.step-dots{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--border);transition:background .3s;cursor:pointer}
.sdot.done{background:var(--green)}.sdot.active{background:var(--accent)}
.code-box{background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px}
.box-label{font-size:10px;font-weight:700;letter-spacing:.8px;margin-bottom:8px;text-transform:uppercase}
.box-label.blue{color:var(--accent)}.box-label.green{color:var(--green)}.box-label.yellow{color:var(--yellow)}.box-label.red{color:var(--red)}.box-label.purple{color:var(--purple)}
.code-snippet{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;font-size:12px;color:#a5d6ff;background:rgba(0,0,0,.4);padding:8px 12px;border-radius:5px;margin-bottom:10px;white-space:pre-wrap;border-left:3px solid var(--accent);line-height:1.7}
.explain-txt{font-size:13px;color:var(--text);line-height:1.75;white-space:pre-wrap}
.info-box{border-radius:8px;padding:11px 14px;margin-bottom:10px;display:flex;gap:10px}
.info-icon{font-size:15px;flex-shrink:0;margin-top:1px}
.info-body{font-size:13px;line-height:1.65}
.tip{background:rgba(210,153,34,.08);border:1px solid rgba(210,153,34,.2)}.tip .info-body{color:#c9a227}
.warn{background:rgba(248,81,73,.07);border:1px solid rgba(248,81,73,.2)}.warn .info-body{color:#d9726d}
.success{background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.2)}.success .info-body{color:#4db85a}
.info{background:rgba(68,147,248,.07);border:1px solid rgba(68,147,248,.2)}.info .info-body{color:#6aacf8}
.result-box{background:#010409;border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px}
.result-label{font-size:10px;font-weight:700;color:var(--green);letter-spacing:.8px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.result-label::before{content:'';width:6px;height:6px;background:var(--green);border-radius:50%;display:inline-block}
.result-code{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;font-size:12px;color:#3fb950;line-height:1.8;white-space:pre-wrap}
.step-box{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px}
.step-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:var(--accent);color:#fff;border-radius:50%;font-size:11px;font-weight:700;margin-right:8px;flex-shrink:0}
.step-title{font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;margin-bottom:8px}
.step-body{font-size:13px;color:var(--text-dim);line-height:1.7;padding-left:30px}
.step-code{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;font-size:12px;background:#010409;color:#a5d6ff;padding:8px 12px;border-radius:5px;margin:8px 0 0 30px;white-space:pre-wrap;border:1px solid var(--border)}
.quiz-box{background:rgba(124,92,191,.07);border:1px solid rgba(124,92,191,.25);border-radius:8px;padding:14px;margin-bottom:12px}
.quiz-q{font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px}
.quiz-opts{display:flex;flex-direction:column;gap:6px}
.qopt{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:13px;color:var(--text-dim);cursor:pointer;transition:all .2s}
.qopt:hover{border-color:var(--accent2);color:var(--text)}
.qopt.correct{background:rgba(63,185,80,.12);border-color:var(--green);color:var(--green);cursor:default}
.qopt.wrong{background:rgba(248,81,73,.1);border-color:var(--red);color:var(--red);cursor:default}
.qfb{font-size:13px;margin-top:10px;display:none;line-height:1.6;padding:8px 12px;border-radius:6px}
.qfb.show{display:block}
.qfb.ok{background:rgba(63,185,80,.1);color:var(--green)}
.qfb.bad{background:rgba(248,81,73,.08);color:var(--red)}
.checklist{margin-bottom:12px}
.chk-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.chk-item:last-child{border-bottom:none}
.chk-item:hover{background:rgba(255,255,255,.02)}
.chk-box{width:17px;height:17px;border:2px solid var(--border);border-radius:4px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .2s}
.chk-item.checked .chk-box{background:var(--green);border-color:var(--green);color:#010409}
.chk-item.checked .chk-lbl{color:var(--text-faint);text-decoration:line-through}
.chk-lbl{font-size:13px;color:var(--text);line-height:1.5}
.err-item{border:1px solid rgba(248,81,73,.2);border-radius:7px;margin-bottom:6px;overflow:hidden}
.err-head{padding:10px 12px;background:rgba(248,81,73,.06);cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#d9726d;font-family:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;gap:8px}
.err-head:hover{background:rgba(248,81,73,.1)}
.err-head-txt{flex:1;word-break:break-all}
.err-body{padding:12px;display:none;font-size:13px;color:var(--text-dim);line-height:1.7;background:var(--surface)}
.err-body.open{display:block}
.err-cause{color:var(--yellow);font-weight:600;margin-bottom:4px}
.err-fix{color:var(--green);margin-bottom:6px}
.err-code{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;font-size:11px;background:#010409;padding:6px 10px;border-radius:4px;margin-top:6px;color:#a5d6ff;white-space:pre-wrap}

/* 홈 */
.home-screen{padding:20px;height:100%;overflow-y:auto}
.home-guide{padding:20px;height:100%;overflow-y:auto}
.roadmap-item{display:flex;align-items:flex-start;gap:12px;padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s;margin-bottom:8px}
.roadmap-item:hover{border-color:var(--accent)}
.roadmap-item.done-item{border-color:rgba(63,185,80,.3)}
.roadmap-num{width:30px;height:30px;border-radius:7px;background:var(--accent);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.roadmap-item.done-item .roadmap-num{background:var(--green)}
.roadmap-info h3{font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px}
.roadmap-info p{font-size:12px;color:var(--text-dim)}
.roadmap-badge{margin-left:auto;font-size:11px;padding:2px 8px;border-radius:99px;flex-shrink:0;align-self:center}
.badge-todo{background:var(--surface3);color:var(--text-dim)}
.badge-done{background:rgba(63,185,80,.15);color:var(--green)}
.screen-split{background:#010409;border:1px solid var(--border);border-radius:8px;padding:12px;font-family:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;font-size:clamp(9px,2.8vw,12px);color:#a5d6ff;line-height:1.8;margin-bottom:10px;overflow-x:auto;max-width:100%}
.divider{border:none;border-top:1px solid var(--border);margin:14px 0}
.section-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:6px}

/* .env 진단 플로우 */
.diag-box{background:var(--surface2);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px}
.diag-head{padding:12px 16px;font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;cursor:pointer}
.diag-head:hover{background:rgba(255,255,255,.03)}
.diag-body{padding:0 16px 14px;display:none}
.diag-body.open{display:block}
.diag-step{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.diag-step:last-child{border-bottom:none}
.diag-num{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.diag-content{font-size:13px;color:var(--text-dim);line-height:1.6}
.diag-content strong{color:var(--text)}
.diag-content code{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;background:#010409;padding:1px 6px;border-radius:3px;font-size:11px;color:#a5d6ff}

/* .env 생성기 */
.env-gen{background:var(--surface2);border:1px solid rgba(210,153,34,.3);border-radius:10px;padding:16px;margin-bottom:12px}
.env-gen-title{font-size:13px;font-weight:700;color:var(--yellow);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.env-field{margin-bottom:10px}
.env-field label{font-size:12px;color:var(--text-dim);display:block;margin-bottom:4px}
.env-field input{width:100%;background:#010409;border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-family:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;font-size:12px;color:var(--text);outline:none;transition:border .2s}
.env-field input:focus{border-color:var(--accent)}
.env-output{background:#010409;border:1px solid var(--green);border-radius:6px;padding:10px 12px;font-family:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;font-size:12px;color:var(--green);line-height:1.8;margin-top:10px;white-space:pre-wrap;display:none}

/* OS 탭 */
.os-tabs{display:flex;gap:0;margin-bottom:10px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.os-tab{flex:1;padding:8px;text-align:center;font-size:12px;font-weight:600;cursor:pointer;background:var(--surface2);color:var(--text-dim);transition:all .2s}
.os-tab.active{background:var(--accent);color:#fff}
.os-content{display:none;font-size:13px;color:var(--text-dim);line-height:1.7}
.os-content.show{display:block}

/* 용어 카드 */
.term-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.term-card:hover{border-color:var(--accent)}
.term-card-head{display:flex;justify-content:space-between;align-items:center}
.term-name{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;font-size:13px;color:var(--accent);font-weight:600}
.term-card-body{margin-top:8px;display:none;font-size:13px;color:var(--text-dim);line-height:1.7}
.term-card-body.open{display:block}
.analogy-box{background:rgba(210,153,34,.08);border-left:3px solid var(--yellow);padding:8px 10px;border-radius:0 6px 6px 0;margin-top:8px;font-size:12px;color:#c9a227}

/* 에러 모음집 탭 */
.err-tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.err-tab{padding:5px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;background:var(--surface2);color:var(--text-dim);border:1px solid var(--border);transition:all .2s}
.err-tab:hover{color:var(--text)}
.err-tab.active{background:rgba(248,81,73,.12);color:var(--red);border-color:rgba(248,81,73,.3)}
.err-group{display:none}.err-group.show{display:block}

/* 스크롤바 */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--green);color:#010409;font-size:13px;font-weight:700;padding:9px 20px;border-radius:99px;z-index:999;transition:transform .3s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ── 반응형 ── */
@media (max-width: 768px) {
  .topnav {
    overflow: hidden;
    padding: 0 8px;
    gap: 6px;
  }
  .logo { font-size: 12px; flex-shrink: 0; }
  .nav-tabs { overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
  .nav-tabs::-webkit-scrollbar { display: none; }
  .nav-tab { font-size: 10px; padding: 4px 7px; white-space: nowrap; }
  .prog-wrap { display: none !important; }
  .layout {
    display: flex !important;
    flex-direction: column !important;
    flex: 1 !important;
    min-height: 0 !important;
    height: calc(100vh - 48px) !important;
    height: calc(calc(var(--vh100,1vh) * 100) - 48px) !important;
  }
  .code-panel {
    flex: none !important;
    height: 45vh;
    height: calc(calc(var(--vh100,1vh) * 100) * 0.45);
    min-height: 180px;
    border-right: none !important;
    border-bottom: 1px solid var(--border);
    overflow: hidden;
  }
  .guide-panel {
    flex: 1 !important;
    min-height: 0;
    overflow: hidden;
  }
  .guide-nav {
    flex-wrap: wrap;
    height: auto !important;
    padding: 6px 8px;
    gap: 4px;
  }
  .guide-nav .btn { font-size: 10px; padding: 5px 7px; }
}
@media (max-width: 480px) {
  #_xpw { display: none !important; }
  .logo { font-size: 11px; }
  .nav-tabs { flex: 1; min-width: 0; }
  .screen-split { display: none; }
  .screen-split-mobile { display: block !important; }
}
.screen-split-mobile { display: none; }

</style>

<style>
@keyframes _cf{from{transform:translateY(-10px) rotate(0);opacity:1}to{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>

</head>
<body>
<div class="topnav">

    "TARGET_COLUMNS = [\"주문자\", \"상품명\", \"주문금액\", \"주문일자\", \"배송상태\"]",
    "",
    "def get_connection():",
    "    return pymysql.connect(",
    "        host=DB_HOST, user=DB_USER,",
    "        password=DB_PASSWORD, db=DB_NAME,",
    "        port=DB_PORT, charset='utf8mb4',",
    "        cursorclass=pymysql.cursors.DictCursor,",
    "        connect_timeout=10",
    "    )",
    "",
    "def test_db_connection():",
    "    try:",
    "        conn = get_connection()",
    "        print(f\"✅ [{DB_HOST}] 연결 성공! (DB: {DB_NAME})\")",
    "        conn.close()",
    "        return True",
    "    except Exception as e:",
    "        print(f\"❌ DB 연결 실패: {e}\")",
    "        return False",
    "",
    "def insert_data_many(data_list):",
    "    connection = None",
    "    try:",
    "        connection = get_connection()",
    "        with connection.cursor() as cursor:",
    "            cols = \", \".join([f\"`{c}`\" for c in TARGET_COLUMNS])",
    "            placeholders = \", \".join([\"%s\"] * len(TARGET_COLUMNS))",
    "            sql = f\"INSERT INTO `{TARGET_TABLE}` ({cols}) VALUES ({placeholders})\"",
    "            cursor.executemany(sql, data_list)",
    "        connection.commit()",
    "        print(f\"✅ 적재 성공: {len(data_list)}건\")",
    "        return True",
    "    except Exception as e:",
    "        print(f\"❌ 적재 실패: {e}\")",
    "        if connection: connection.rollback()",
    "        return False",
    "    finally:",
    "        if connection: connection.close()",
    "",
    "if __name__ == \"__main__\":",
    "    if test_db_connection():",
    "        items_to_insert = [",

    "            (\"차정원\", \"게이밍 마우스\", 29550, \"2024-02-03\", \"배송중\"),",
    "        ]",
    "        insert_data_many(items_to_insert)",

{
  id:'f3',label:'③ Table 이관',fname:'DB_데이터_이관_기초(Table_to_Table).py',
  summary:'DB의 한 테이블 → 다른 테이블로 데이터를 옮기는 코드예요.\n컬럼 이름이 달라도 매핑으로 해결해요!',
  code:[
    "import pymysql",
    "",
    "SOURCE_TABLE = \"SIIC_commpart\"  # 원본 테이블",
    "TARGET_TABLE = \"SIIC_comm\"      # 대상 테이블",
    "",
    "COLUMN_MAPPING = {",
    "    \"고객명\": \"주문자\",",
    "    \"카테고리\": \"상품명\",",
    "    \"주문금액\": \"주문금액\",",
    "    \"주문일자\": \"주문일자\",",
    "}",
    "",
    "def read_source_data():",
    "    conn = get_connection()",
    "    with conn.cursor() as cursor:",
    "        source_cols = list(COLUMN_MAPPING.keys())",
    "        sql = f\"SELECT {', '.join(source_cols)} FROM `{SOURCE_TABLE}`\"",
    "        cursor.execute(sql)",
    "        result = cursor.fetchall()",
    "    print(f\"📂 원본 조회: {len(result)}행\")",
    "    return [tuple(r[c] for c in source_cols) for r in result]",
    "",
    "if __name__ == \"__main__\":",
    "    data = read_source_data()",
    "    if data: insert_data_many(data)",

{
  id:'f4',label:'④ Jira API',fname:'지라_로그인_수집_DB_저장(requests,api).py',
  summary:'Jira REST API로 이슈를 수집해 DB에 저장해요.\n브라우저 없이 코드로 Jira에 접속하는 방식이에요!',
  code:[
    "import requests",
    "from requests.auth import HTTPBasicAuth",
    "from dotenv import load_dotenv",
    "import pymysql, os",
    "",
    "load_dotenv()",
    "",
    "JIRA_URL = \"https://jira.simplexi.com\"",
    "JIRA_ID = os.getenv('JIRA_ID')",
    "JIRA_PW = os.getenv('JIRA_PW')",
    "",
    "def get_jira_issues_api(jql, start_at=0, max_results=50):",
    "    search_url = f\"{JIRA_URL}/rest/api/2/search\"",
    "    query = {",
    "        'jql': jql, 'startAt': start_at,",
    "        'maxResults': max_results,",
    "        'fields': 'project,summary,status,assignee,created'",
    "    }",
    "    auth = HTTPBasicAuth(JIRA_ID, JIRA_PW)",
    "    response = requests.get(search_url, params=query, auth=auth)",
    "    response.raise_for_status()",
    "    return response.json()",
    "",
    "def collect_all_issues():",
    "    jql = \"assignee in (ecmsjmjo001) AND created >= '2026-01-01'\"",
    "    start_at, all_issues = 0, []",
    "    while True:",
    "        data = get_jira_issues_api(jql, start_at)",
    "        if not data or not data['issues']: break",
    "        for issue in data['issues']:",
    "            fields = issue.get('fields', {})",
    "            all_issues.append({",
    "                'issuekey': issue.get('key',''),",
    "                'summary': fields.get('summary','')",
    "            })",
    "        if start_at + len(data['issues']) >= data['total']: break",
    "        start_at += 50",
    "    return all_issues",
  ],
  guides:{
    5:{stage:'🔐 STAGE 1 · 보안',title:'load_dotenv() + os.getenv() — 안전한 인증 정보',desc:'.env 파일에서 ID/PW를 안전하게 읽어요. 코드에 비밀번호를 직접 쓰지 않아요.',code:'load_dotenv()\nJIRA_ID = os.getenv("JIRA_ID")\nJIRA_PW = os.getenv("JIRA_PW")',explain:'.env 파일 내용 예시:\nJIRA_ID=hong123\nJIRA_PW=mypassword\n\nload_dotenv() → .env 파일 읽기\nos.getenv("JIRA_ID") → 값 꺼내기\n\n⚠️ PC마다 .env 파일 위치가 달라요!\n설정 방법: 오른쪽 위 🔐 버튼 클릭',tip:{type:'warn',icon:'🔐',text:'.env 파일이 없거나 위치가 틀리면<br>os.getenv()가 <b>None</b>을 반환해요!<br>🔐 .env 버튼에서 설정 방법 확인하세요.'},steps:null,result:null,quiz:null,checks:null},
    11:{stage:'🌐 STAGE 2 · API 호출',title:'requests.get() — Jira에 데이터 요청',desc:'HTTP 요청으로 Jira 서버에서 이슈 데이터를 JSON으로 받아와요.',code:'response = requests.get(search_url, params=query, auth=auth)\nresponse.raise_for_status()\nreturn response.json()',explain:'requests.get()     = 데이터 요청 (GET)\nparams=query        = 검색 조건 전달\nauth=auth           = ID/PW 인증\nraise_for_status()  = 에러 응답 시 예외 발생\n.json()             = 응답을 딕셔너리로 변환',tip:{type:'tip',icon:'🌐',text:'API = 전화 주문이에요.<br>식당(Jira)에 직접 가지 않고<br>전화(코드)로 주문해서 데이터를 받아요.'},steps:null,result:null,quiz:null,checks:null},
    25:{stage:'🔄 STAGE 3 · 페이징',title:'while True + 페이징 — 전체 이슈 수집',desc:'Jira는 50개씩만 줘요. while 루프로 50개씩 반복 요청해 전체를 가져와요.',code:'while True:\n    data = get_jira_issues_api(jql, start_at)\n    if not data["issues"]: break\n    start_at += 50',explain:'150개 이슈라면:\n1회: 1~50번 수집\n2회: 51~100번 수집\n3회: 101~150번 수집\n4회: 이슈 없음 → break\n\nbreak = 루프 즉시 종료',tip:{type:'warn',icon:'⚠️',text:'while True는 무한 반복이에요.<br><b>break 조건이 없으면 영원히 실행!</b>'},steps:null,result:'현재 수집: 50 / 127건\n현재 수집: 100 / 127건\n현재 수집: 127 / 127건',quiz:{q:'start_at += 50 의 의미는?',opts:['50개 삭제','시작 위치를 50 증가 (다음 페이지)','50개만 가져오기','50초 대기'],ans:1,ok:'✅ 정답! 다음 요청 시 51번째부터 가져와요.',bad:'❌ start_at에 50을 더해 다음 페이지로 이동해요.'},

{

  summary:'크롬을 코드로 조종해서 Jira에 자동 로그인 후 데이터를 수집해요.\nAPI가 막힌 환경에서 사용하는 방법이에요!',

{
  id:'f6',label:'⑥ Jira 엑셀+DB',fname:'지라_로그인_수집_엑셀파일_DB_저장.py',
  summary:'Jira 수집 → 엑셀 저장 → DB 적재 3단계 파이프라인이에요.\n중간에 엑셀로 저장해서 눈으로 확인 후 DB에 넣어요!',
  code:[
    "# 셀레니움으로 Jira 수집 (⑤와 동일)",
    "import pandas as pd",
    "",
    "all_issues.sort(key=lambda x: x['assignee'])",
    "collected_data = all_issues",
    "",
    "insert_sql = \"\"\"",
    "    INSERT INTO JIRA_TEST",
    "    (프로젝트, 이슈키, 제목, 상태, 보고자, 담당자, 생성일)",
    "    VALUES (%s, %s, %s, %s, %s, %s, %s)",
    "    ON DUPLICATE KEY UPDATE",
    "        제목 = VALUES(제목),",
    "        상태 = VALUES(상태)",
    "\"\"\"",
    "",
    "if collected_data:",
    "    df = pd.DataFrame(collected_data)",
    "    df.columns = ['프로젝트','이슈키','제목','상태','보고자','담당자','생성일']",
    "    df.to_excel('지라수집.xlsx', index=False)",
    "    print('[OK] 엑셀 저장 완료')",
    "    # 엑셀에서 다시 읽어서 DB에 적재",
    "    df2 = pd.read_excel('지라수집.xlsx')",
    "    data = [tuple(x) for x in df2.values]",
    "    cursor.executemany(insert_sql, data)",
    "    connection.commit()",
  ],

function init(){
  const tabs=document.getElementById('navTabs');
  FILES.forEach(f=>{
    const t=document.createElement('div');
    t.className='nav-tab'; t.id='tab-'+f.id;
    t.textContent=f.label; t.onclick=()=>selectFile(f.id);
    tabs.appendChild(t);
  });
  selectFile('home');
}

function selectFile(id){
  curFile=FILES.find(f=>f.id===id); curLineIdx=null;
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  const tab=document.getElementById('tab-'+id);
  if(tab)tab.classList.add('active');
  document.getElementById('codeFname').textContent=curFile.fname;
  if(curFile.isHome){renderHome();document.getElementById('guideNav').style.display='none';return;}
  renderCode(); renderFileWelcome();
  document.getElementById('guideNav').style.display='none';
  updateProgress();
}

function showWarnings(){
  if(!curFile || !FILE_WARNINGS[curFile.id]){
    document.getElementById('guideScroll').innerHTML=`
    <div>
      <div class="stage-pill" style="background:rgba(240,136,62,.1);border-color:rgba(240,136,62,.3);color:var(--orange)">⚠️ 주의사항</div>
      <div class="g-title">이 화면엔 주의사항이 없어요</div>
      <div class="g-desc">파일 탭을 선택하면 해당 파일의 주의사항이 나와요.</div>
    </div>`;
    document.getElementById('guideNav').style.display='none';
    return;
  }
  const w = FILE_WARNINGS[curFile.id];
  let html=`
  <div>
    <div class="stage-pill" style="background:rgba(240,136,62,.1);border-color:rgba(240,136,62,.3);color:var(--orange)">⚠️ 수정 필요 항목 & 주의사항</div>
    <div class="g-title">${w.title}</div>
    <div class="info-box warn">
      <div class="info-icon">🚨</div>
      <div class="info-body"><b>이 파일을 내 환경에서 실행하려면 아래 항목을 반드시 수정해야 해요!</b><br>그대로 실행하면 100% 오류가 발생해요.</div>
    </div>
    <div class="divider"></div>
    <div class="section-title" style="color:var(--red)">🔴 반드시 수정해야 하는 항목</div>`;

  w.mustChange.forEach((m,i)=>{
    html+=`
    <div class="diag-box">
      <div class="diag-head" style="color:var(--orange)" onclick="toggleDiag('wc${curFile.id}${i}')">
        <span style="font-family:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;font-size:12px">${m.item}</span>
        <span style="font-size:11px;color:var(--text-dim);margin-left:8px">${m.desc}</span>
        <span style="margin-left:auto;font-size:11px;color:var(--text-faint)">▼</span>
      </div>
      <div class="diag-body" id="wc${curFile.id}${i}">
        <div class="diag-step">
          <div class="diag-num" style="background:var(--red)">현재</div>
          <div class="diag-content"><code>${m.current}</code></div>
        </div>
        <div class="diag-step">
          <div class="diag-num" style="background:var(--green)">변경</div>
          <div class="diag-content"><strong>${m.desc}</strong><div class="err-code">${m.example}</div></div>
        </div>
      </div>
    </div>`;
  });

  html+=`<div class="divider"></div><div class="section-title" style="color:var(--orange)">⚠️ 실행 전 꼭 읽어야 할 주의사항</div>`;
  w.cautions.forEach(c=>{
    const isRed=c.startsWith('🚨');
    const isBlue=c.startsWith('💡');
    html+=`<div class="info-box ${isRed?'warn':isBlue?'tip':'warn'}" style="margin-bottom:8px">
      <div class="info-icon">${isRed?'🚨':isBlue?'💡':'⚠️'}</div>
      <div class="info-body">${c.replace(/^[🚨⚠️💡]\s*/,'')}</div>
    </div>`;
  });

  html+=`
    <div class="divider"></div>
    <div class="info-box info">
      <div class="info-icon">📋</div>
      <div class="info-body"><b>공통 주의사항 (모든 파일 해당)</b><br>
      • VPN 연결 여부 확인 (회사 내부 시스템 접근 시 필수)<br>
      • 처음 실행은 반드시 <b>테스트 DB</b>에서 먼저!<br>
      • 파일명과 폴더명을 <b>영어</b>로 사용 권장 (한글 경로 오류 가능)<br>
      • .env 파일은 파이썬 파일과 <b>같은 폴더</b>에 위치<br>
      • Python 인터프리터가 3.10 이상인지 VS Code 하단에서 확인
      </div>
    </div>
  </div>`;

  document.getElementById('guideScroll').innerHTML=html;
  document.getElementById('guideScroll').scrollTop=0;
  document.getElementById('guideNav').style.display='none';
}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px">
      ${GPT_TIPS.map(t=>`
      <div onclick="scrollToGpt('${t.id}')" style="padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;cursor:pointer;font-size:12px;color:var(--text-dim);transition:all .2s" onmouseover="this.style.borderColor='${t.color}';this.style.color='${t.color}'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text-dim)'">${t.icon} ${t.title.replace(/^[🚨🔍🔧🐛📋⚡💡]\s*/,'').substring(0,20)}</div>`).join('')}

    <div class="divider"></div>`;

  GPT_TIPS.forEach(tip=>{
    html+=`<div id="${tip.id}" style="margin-bottom:20px">
      <div style="font-size:14px;font-weight:700;color:${tip.color};margin-bottom:8px">${tip.icon} ${tip.title.replace(/^[🚨🔍🔧🐛📋⚡💡]\s*/,'')}</div>
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:10px">${tip.desc}</div>`;
    if(tip.template){
      const esc=tip.template.replace(/`/g,'\\`').replace(/\${/g,'\\${');
      html+=`<div style="background:${tip.bg};border:1px solid ${tip.border};border-radius:8px;padding:14px;margin-bottom:8px">
        <div style="font-size:10px;font-weight:700;color:${tip.color};letter-spacing:.8px;margin-bottom:8px">📋 ChatGPT 질문 템플릿 — 복사해서 쓰세요</div>
        <div style="font-family:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;font-size:11px;color:var(--text);line-height:1.8;white-space:pre-wrap;background:rgba(0,0,0,.3);padding:10px;border-radius:5px;max-height:200px;overflow-y:auto">${tip.template.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>

      </div>`;
    }

    if(tip.tips){
      html+=`<div style="display:flex;flex-direction:column;gap:6px">`;
      tip.tips.forEach((t,i)=>{
        html+=`<div style="background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:11px 14px">
          <div style="font-size:13px;font-weight:700;color:#10a37f;margin-bottom:4px">${i+1}. ${t.t}</div>

        </div>`;
      });
      html+=`</div>`;
    }
    html+=`<div class="divider"></div>`;
  });

    </div>`).join('')}

  gs.innerHTML=html;
  gs.scrollTop=0;
  document.getElementById('guideNav').style.display='none';
}

function scrollToGpt(id){
  const el=document.getElementById(id);
  if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
}

function copyGptTemplate(id){
  const tip=GPT_TIPS.find(t=>t.id===id);
  if(tip&&tip.template){
    navigator.clipboard.writeText(tip.template).then(()=>toast('📋 템플릿 복사됐어요! ChatGPT에 붙여넣으세요.')).catch(()=>toast('❌ 복사 실패 (권한 확인 필요)'));
  }
}

function genEnv(show){
  const ALL_KEYS = [
    {key:'DB_HOST', group:'DB 접속 정보', desc:'# DB 서버 주소'},
    {key:'DB_USER', group:'DB 접속 정보', desc:'# DB 사용자명'},
    {key:'DB_PASSWORD', group:'DB 접속 정보', desc:'# DB 비밀번호'},
    {key:'DB_NAME', group:'DB 접속 정보', desc:'# DB 이름'},
    {key:'DB_PORT', group:'DB 접속 정보', desc:'# DB 포트 (기본 3306)'},
    {key:'JIRA_ID', group:'Jira 접속 정보', desc:'# Jira 사용자 ID (영문 username)'},
    {key:'JIRA_PW', group:'Jira 접속 정보', desc:'# Jira 비밀번호'},
    {key:'CMS_ID', group:'CMS/OKTA 접속 정보', desc:'# OKTA 로그인 아이디'},
    {key:'CMS_PW', group:'CMS/OKTA 접속 정보', desc:'# OKTA 로그인 비밀번호'},
    {key:'CMS_PHONE', group:'CMS/OKTA 접속 정보', desc:'# CMS 내선번호'},
  ];
  let lines = ['# ============================================='];
  lines.push('# 파이썬 업무 자동화 .env 설정 파일');
  lines.push('# 주의: = 기호 앞뒤에 공백 없이 입력하세요!');
  lines.push('# 주의: 이 파일은 절대 공유/Git 업로드 금지!');
  lines.push('# =============================================');
  lines.push('');
  let lastGroup = '';
  let hasAny = false;
  ALL_KEYS.forEach(({key, group, desc}) => {
    const el = document.getElementById('ef_'+key);
    const v = el ? el.value.trim() : '';
    if(group !== lastGroup) {
      lines.push('');
      lines.push('# ── ' + group + ' ──');
      lastGroup = group;
    }
    lines.push(desc);
    if(v) { lines.push(`${key}=${v}`); hasAny = true; }
    else { lines.push(`# ${key}=여기에_입력`); }
  });
  lines.push('');
  lines.push('# =============================================');
  lines.push('# 저장 방법: 이 내용을 복사 → 메모장 붙여넣기');
  lines.push('# → 파일명을 .env 로 저장 (.txt 아님!)');
  lines.push('# → 파이썬 파일(.py)과 같은 폴더에 저장!');
  lines.push('# =============================================');
  const out = document.getElementById('envOutput');
  const wrap = document.getElementById('envCopyWrap');
  out.textContent = lines.join('\n');
  out.style.display = 'block';
  wrap.style.display = hasAny || show ? 'block' : 'none';
}
function copyEnv(){
  const t=document.getElementById('envOutput')?.textContent;
  if(t)navigator.clipboard.writeText(t).then(()=>toast('📋 .env 내용 복사됐어요! 메모장에 붙여넣고 .env로 저장하세요.')).catch(()=>toast('❌ 복사 실패 (권한 확인 필요)'));
}

const KW=/\b(import|from|as|def|return|if|else|elif|for|while|in|not|and|or|try|except|finally|with|True|False|None|break|class|lambda)\b/g;
const FN=/\b([a-zA-Z_]\w*)\s*(?=\()/g;
const ST=/("""[\s\S]*?"""|'''[\s\S]*?'''|"[^"]*"|'[^']*')/g;
const NM=/\b(\d+)\b/g;
function hl(c){
  if(!c.trim())return '\u00a0';
  if(c.trimStart().startsWith('#')){
    const esc=c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return `<span class="cm">${esc}</span>`;
  }
  const strs=[];
  let h=c.replace(ST, function(m){ strs.push(m); return '\u0001STRPLACEHOLDER'+strs.length+'X\u0002'; });
  h=h.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  h=h.replace(KW,'<span class="kw">$1</span>');
  h=h.replace(FN,'<span class="fn">$1</span>');
  h=h.replace(NM,'<span class="nm">$1</span>');
  h=h.replace(/\u0001STRPLACEHOLDER(\d+)X\u0002/g, function(_, idx){
    const raw=strs[+idx-1];
    const esc=raw.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return '<span class="st">'+esc+'</span>';
  });
  return h;
}

    d.id='cl-'+idx;

    else d.style.cursor='default';
    d.innerHTML=`<div class="lmark">${hasG?'●':''}</div><div class="lnum">${idx+1}</div><div class="lcode">${hl(line)}</div>`;
    el.appendChild(d);
  });
}

function isFileDone(f){
  if(!f.guides)return false;
  return Object.entries(f.guides).every(([idx,g])=>{
    if(!g.checks)return true;
    const s=S[f.id+'-'+idx+'_c']||{};
    return g.checks.every((_,i)=>s[i]);
  });
}
function updateProgress(){
  let total=0,done=0;
  FILES.filter(f=>!f.isHome).forEach(f=>{
    Object.entries(f.guides||{}).forEach(([idx,g])=>{
      if(!g.checks)return; total+=g.checks.length;
      const s=S[f.id+'-'+idx+'_c']||{};
      done+=g.checks.filter((_,i)=>s[i]).length;
    });
  });
  const pct=total>0?Math.round(done/total*100):0;
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progTxt').textContent=pct+'%';
  FILES.filter(f=>!f.isHome).forEach(f=>{
    const t=document.getElementById('tab-'+f.id);
    if(t&&isFileDone(f)&&!t.textContent.startsWith('✅'))t.textContent='✅ '+t.textContent;
  });
}

  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');

}

  return '<div style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;margin-bottom:12px">'
    +'<div style="font-size:22px;flex-shrink:0">🐍</div>'
    +'<div style="font-size:12px;color:var(--text);line-height:1.6;padding-left:8px;border-left:3px solid var(--accent)">'+msg+'</div>'
    +'</div>';
}

function simBox(key){
  var sid=key.replace('-','_');
  return '<div style="background:#030712;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:10px">'
    +'<div style="padding:6px 11px;background:var(--surface2);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)">'
    +'<span style="font-size:10px;color:#3fb950;font-weight:700">● 터미널 실행 시뮬레이터</span>'
    +'<button id="_sb_'+sid+'" onclick="window._rs(\''+key+'\')" style="padding:3px 9px;border-radius:4px;border:none;background:#3fb950;color:#030712;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">▶ 실행</button>'
    +'</div><div id="_so_'+sid+'" style="padding:9px 11px;font-family:JetBrains Mono,monospace;font-size:12px;line-height:1.9;min-height:44px"><span style="color:#8b949e">▶ 버튼을 눌러보세요!</span></div></div>';
}

window._rs=function(key){
  var ls=SI[key];if(!ls)return;
  var sid=key.replace('-','_');
  var out=document.getElementById('_so_'+sid);
  var btn=document.getElementById('_sb_'+sid);
  if(!out||!btn)return;
  btn.disabled=true;btn.textContent='실행 중...';out.innerHTML='';
  ls.forEach(function(l,i){
    setTimeout(function(){
      var d=document.createElement('div');
      d.style.cssText='opacity:0;transform:translateX(-4px);transition:all .25s;color:'+l.c;
      d.textContent=l.t;out.appendChild(d);
      setTimeout(function(){d.style.opacity='1';d.style.transform='none';},30);
      if(i===ls.length-1)setTimeout(function(){btn.disabled=false;btn.textContent='▶ 다시 실행';ax(5,'시뮬레이션');},400);
    },l.d||300);
  });
};

// 게임 패널 (홈 오른쪽)
function gPanel(){
  var gs=document.getElementById('guideScroll');
  if(!gs||typeof curFile==='undefined'||curFile.id!=='home')return;
  var x=G.xp||0,lv=glv(),pct=Math.min(100,Math.round((x-lv.min)/(lv.next-lv.min)*100));
  var hist=(G.h||[]).slice(-6).reverse();
  var bhtml=BD.map(function(b){
    var e=G.bd[b.id];
    return '<div style="background:var(--surface2);border:1px solid '+(e?'rgba(210,153,34,.4)':'var(--border)')+';border-radius:8px;padding:8px 4px;text-align:center">'
      +'<div style="font-size:17px;'+(e?'':'filter:grayscale(1) opacity(.3)')+'">'+b.ico+'</div>'
      +'<div style="font-size:9px;font-weight:700;color:'+(e?'#d29922':'var(--text-faint)')+'">'+b.nm+'</div>'
      +'</div>';
  }).join('');
  gs.innerHTML='<div>'
    +'<div style="font-size:12px;font-weight:700;color:var(--text);margin-bottom:10px">🎮 내 학습 현황</div>'
    +'<div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:13px;margin-bottom:12px">'
      +'<div style="font-size:11px;color:var(--text-dim);margin-bottom:3px">현재 레벨</div>'
      +'<div style="font-size:15px;font-weight:700;color:#d29922;margin-bottom:7px">'+lv.name+'</div>'
      +'<div style="display:flex;align-items:center;gap:8px">'
        +'<div style="flex:1;height:6px;background:var(--border);border-radius:99px;overflow:hidden"><div style="width:'+pct+'%;height:100%;background:linear-gradient(90deg,#d29922,#f0883e);border-radius:99px"></div></div>'
        +'<span style="font-size:11px;color:#d29922;font-weight:700">'+x+' XP</span>'
      +'</div>'
      +'<div style="font-size:10px;color:var(--text-faint);margin-top:3px">'+(lv.next===9999?'최고 레벨!':'다음 레벨까지 '+(lv.next-x)+' XP')+'</div>'
    +'</div>'
    +'<div style="font-size:12px;font-weight:700;color:var(--text);margin-bottom:8px">🏆 뱃지 ('+Object.keys(G.bd).length+'/'+BD.length+')</div>'
    +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:12px">'+bhtml+'</div>'
    +'<div style="font-size:12px;font-weight:700;color:var(--text);margin-bottom:7px">📅 학습 기록</div>'
    +(hist.length?hist.map(function(h){return'<div style="display:flex;gap:6px;padding:4px 0;border-bottom:1px solid var(--border2)"><span style="font-size:10px;color:var(--text-faint);min-width:50px">'+h.d+'</span><span style="font-size:11px;color:var(--text-dim);flex:1">'+h.r+'</span><span style="font-size:10px;color:var(--accent)">'+h.x+'</span></div>';}).join(''):'<div style="font-size:12px;color:var(--text-dim)">학습하면 기록이 쌓여요!</div>')
    +'<div style="margin-top:10px"><button onclick="selectFile(\'f1\')" style="width:100%;padding:8px;background:var(--accent);color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">① DB 기초부터 시작 →</button></div>'
    +'</div>';
}

// 이벤트 훅
var _oSL=window.selectLine;
if(typeof _oSL==='function'){
  window.selectLine=function(idx){
    _oSL(idx);
    setTimeout(function(){
      var gs=document.getElementById('guideScroll');
      if(!gs||typeof curFile==='undefined')return;
      var sk=curFile.id+'-'+idx;
      gs.innerHTML=msHtml(MM[curFile.id]||'이 줄을 함께 살펴봐요!')+(SI[sk]?simBox(sk):'')+gs.innerHTML;
    },10);
  };
}

var _oRFW=window.renderFileWelcome;
if(typeof _oRFW==='function'){
  window.renderFileWelcome=function(){
    _oRFW();
    setTimeout(function(){
      var gs=document.getElementById('guideScroll');
      if(!gs||typeof curFile==='undefined')return;
      var di=DF[curFile.id];
      var badge=di?'<div style="margin-bottom:10px"><span style="font-size:11px;padding:2px 9px;border-radius:99px;font-weight:700;background:'+(di.d==='easy'?'rgba(63,185,80,.15);color:#3fb950':di.d==='mid'?'rgba(210,153,34,.12);color:#d29922':'rgba(248,81,73,.12);color:#f85149')+'">'+{easy:'🟢 쉬움',mid:'🟡 보통',hard:'🔴 어려움'}[di.d]+'</span> <span style="font-size:10px;color:var(--text-faint)">⏱ 약 '+di.t+'분</span></div>':'';
      gs.innerHTML=msHtml(MM[curFile.id]||'이 파일을 같이 배워봐요!')+badge+gs.innerHTML;
    },10);
  };
}

var _oRH=window.renderHome;
if(typeof _oRH==='function'){
  window.renderHome=function(){
    _oRH();
    setTimeout(gPanel,50);
  };
}

var _oAQ=window.answerQ;
if(typeof _oAQ==='function'){
  window.answerQ=function(li,chosen,correct,fkey){
    _oAQ(li,chosen,correct,fkey);
    if(chosen===correct){ax(20,'퀴즈 정답');G.s=(G.s||0)+1;if(G.s>=3)eb('b_quiz');sg();}
    else{G.s=0;sg();}
  };
}

var _oCA=window.copyAll;
if(typeof _oCA==='function'){
  window.copyAll=function(){_oCA();ax(5,'코드 복사');};
}

var _oSE=window.showErrors;
if(typeof _oSE==='function'){
  window.showErrors=function(){_oSE();G.ec=(G.ec||0)+1;if(G.ec>=3)eb('b_err');sg();};
}

var _oSG=window.showGptTips;
if(typeof _oSG==='function'){
  window.showGptTips=function(){_oSG();eb('b_gpt');};
}

var _oCGT=window.copyGptTemplate;
if(typeof _oCGT==='function'){
  window.copyGptTemplate=function(id){_oCGT(id);eb('b_gpt');};
}

var _origToggleCheck = window.toggleCheck;
if(typeof _origToggleCheck === 'function'){
  window.toggleCheck = function(fkey, i, li){
    var wasChecked = !!(S[fkey+'_c'] && S[fkey+'_c'][i]);
    _origToggleCheck(fkey, i, li);
    var nowChecked = !!(S[fkey+'_c'] && S[fkey+'_c'][i]);
    if(!wasChecked && nowChecked){
      ax(10,'체크리스트 완료');
      if(!G.bd.b_first)eb('b_first');
      if(typeof curFile!=='undefined'&&typeof isFileDone!=='undefined'){
        var mp={f1:'b_db',f2:'b_excel',f4:'b_api',f5:'b_bot'};
        if(mp[curFile.id]&&isFileDone(curFile))eb(mp[curFile.id]);
        if(typeof FILES!=='undefined'&&FILES.filter(function(f){return !f.isHome;}).every(isFileDone))eb('b_all');
      }
    }
  };
}

uxp();

// 한줄질문 복사 버튼 이벤트 위임 (onclick 인라인의 따옴표 충돌 문제 방지)
document.addEventListener('click', function(e){
  var btn = e.target.closest ? e.target.closest('.quick-q-copy') : null;
  if(btn){
    var qi = parseInt(btn.getAttribute('data-qidx'), 10);
    var item = (typeof QUICK_Q_LIST !== 'undefined') ? QUICK_Q_LIST[qi] : null;
    if(item){
      var qText = item[1];
      navigator.clipboard.writeText(qText).then(function(){
        toast('📋 복사됐어요! ChatGPT에 붙여넣으세요.');
      }).catch(function(){
        toast('❌ 복사 실패 (권한 확인 필요)');
      });
    }
  }
});
})();

</script>
